<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Switzer</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Switzer</family></prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer><family>Maple Mono NF</family></prefer>
  </alias>

  <!-- Force Electron/Chromium UI to Switzer (Grok Bot etc.) -->
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Switzer</string></edit>
  </match>
</fontconfig>
