# wayland
--ozone-platform=wayland
--enable-wayland-ime
--wayland-text-input-version=3

--ignore-gpu-blocklist
--enable-zero-copy
--enable-unsafe-webgpu
--use-webgpu-adapter=opengles

# VA-API hardware video acceleration for AMD.
# NOTE: Vulkan/ANGLE-Vulkan is disabled — incompatible with native Wayland
# (Chromium upstream blocks it). OpenGL/ANGLE still provides full HW accel.
--enable-features=AcceleratedVideoEncoder,VaapiIgnoreDriverChecks
