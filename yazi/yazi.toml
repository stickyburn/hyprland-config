[mgr]
show_hidden = true
linemode = "size"

[opener]
opencode = [
  { run = 'kitty @ launch --type=tab -- zsh -c "cd %s && opencode"', desc = "Opencode" },
]

nvim_file = [{ run = 'nvim %s', block = true, desc = "Nvim" }]

nvim = [
  { run = 'kitty @ launch --type=tab -- zsh -c "cd %s && nvim"', desc = "Nvim" },
]

codium = [
  { run = 'open -a "VSCodium" %s', for = "macos", desc = "Code" },
  { run = 'zsh -c "cd %s && codium ."', for = "linux", desc = "Code" },
]

terminal = [{ run = 'kitty @ launch --type=tab --cwd=%s', desc = "Kitty" }]

finder = [
  { run = 'open -R %s', for = "macos", desc = "Finder" },
  { run = 'xdg-open %d', for = "linux", desc = "Finder" },
]

[open]
rules = [
  { url = "*", use = [
    "nvim_file",
  ] },
  { url = "*/", use = [
    "opencode",
    "nvim",
    "codium",
    "terminal",
    "finder",
  ] },
]
