# Window Rules

# xdg portal file dialogs (locale-independent)
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk

# app floaters
window_rule=is_floating:1,width:1500,height:900,app_id:blueman-manager
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1

# mpv lives on tag 2
window_rule=tags:2,app_id:mpv

# vivaldi picture-in-picture ("Picture in picture")
window_rule=is_floating:1,width:640,height:360,no_blur:1,focused_opacity:1,unfocused_opacity:1,title:Picture.in.picture

# bongo-cat desktop pet overlay
# window_rule=is_floating:1,is_overlay:1,no_border:1,is_unmanaged_global:1,width:400,height:400,offset_x:9999,offset_y:9999,app_id:bongo-cat,title:BongoCat

# layer rules
layer_rule=no_blur:1,no_animation:1,layer_name:selection
layer_rule=no_blur:1,no_animation:1,layer_name:waybar
layer_rule=no_animation:1,layer_name:rofi
