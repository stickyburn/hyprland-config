# Window Rules

# xdg portal file dialogs (locale-independent)
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

# app floaters
windowrule=isfloating:1,width:1500,height:900,appid:blueman-manager
windowrule=isfloating:1,appid:xfce-polkit

# mpv lives on tag 2
windowrule=tags:2,appid:mpv

# picture-in-picture (firefox: "Picture-in-Picture", chromium: "Picture in Picture")
windowrule=isfloating:1,width:640,height:360,title:Picture.in.Picture

# bongo-cat desktop pet overlay
# windowrule=isfloating:1,isoverlay:1,isnoborder:1,isunglobal:1,width:400,height:400,offsetx:9999,offsety:9999,appid:bongo-cat,title:BongoCat

# layer rules
layerrule=noblur:1,noanim:1,layer_name:selection
layerrule=noshadow:1,layer_name:swaync-control-center
layerrule=noshadow:1,layer_name:swaync-notification-window
layerrule=noshadow:1,noblur:1,noanim:1,layer_name:waybar
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=noanim:1,layer_name:rofi