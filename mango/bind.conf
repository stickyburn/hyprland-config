# reload config
bindc=ALT+CTRL,r,reload_config

# menu and terminal
bind=CTRL,Return,spawn,kitty
bind=CTRL,space,spawn,rofi -show drun
bind=CTRL+SHIFT,space,spawn,rofimoji

# exit
bind=ALT+SHIFT,q,quit

# close window
bind=ALT,q,killclient

# switch window focus
bind=ALT,n,focusstack,prev
bind=ALT,e,focusstack,next

# move windows
bind=ALT,i,exchange_client,left
bind=ALT,o,exchange_client,right

# layout switching
bind=ALT,t,setlayout,dwindle
bind=ALT,s,setlayout,scroller
bind=ALT,f,setlayout,monocle
# cycle through all layouts: alt+ctrl+n (tile,dwindle,fair,scroller,monocle,grid,deck,center_tile)
bind=ALT+CTRL,n,switch_layout

# floating toggle
bind=ALT,space,togglefloating

# dwindle split direction
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# overview
bind=ALT+CTRL,Tab,overcircle,next
bind=ALT,Tab,togglejump

# switch tags: alt+l/u/y/semicolon/j = tags 1-5
bind=ALT,l,view,1
bind=ALT,u,view,2
bind=ALT,y,view,3
bind=ALT,semicolon,view,4
bind=ALT,j,view,5
# next / previous tag
bind=ALT,period,viewtoright,0
bind=ALT,comma,viewtoleft,0
# return to the last viewed tag
bind=ALT,slash,view,-1

# move window to tag
bind=ALT+CTRL,l,tag,1
bind=ALT+CTRL,u,tag,2
bind=ALT+CTRL,y,tag,3
bind=ALT+CTRL,semicolon,tag,4
bind=ALT+CTRL,j,tag,5
bind=ALT+CTRL,period,tagtoright,0
bind=ALT+CTRL,comma,tagtoleft,0

# bar visibility
bind=ALT+SHIFT,u,spawn,pkill -USR1 -x waybar

# scratchpad
bind=ALT,z,toggle_scratchpad

# gaps
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# volume keys (direct audio control)
bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +3%
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -3%
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle

# notification center
bind=ALT+SHIFT,n,spawn,swaync-client -t -sw

# app launchers
bind=ALT,b,spawn,blueman-manager
bind=ALT,p,spawn,pavucontrol

# screenshot region to clipboard
bind=ALT+SHIFT,s,spawn_shell,region=$(slurp) && grim -g "$region" - | wl-copy --type image/png

# mouse drag move/resize
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
