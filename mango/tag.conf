# Use exactly five tags.
tag_num=5

# Apply the default first; later matching rules override it
tagrule=id:*,layout_name:scroller
tagrule=id:1,layout_name:tile

# Keep 1–5 visible through ext-workspace, even when empty.
tagrule=id:1,no_hide:1
tagrule=id:2,no_hide:1
tagrule=id:3,no_hide:1
tagrule=id:4,no_hide:1
tagrule=id:5,no_hide:1
