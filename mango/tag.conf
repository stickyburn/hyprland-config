tag_num=5

# Apply the default first; later matching rules override it
tag_rule=id:*,layout_name:scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile

# Keep 1–5 visible through ext-workspace, even when empty.
tag_rule=id:1,no_hide:1
tag_rule=id:2,no_hide:1
tag_rule=id:3,no_hide:1
tag_rule=id:4,no_hide:1
tag_rule=id:5,no_hide:1
