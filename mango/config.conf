# Effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 8
blur_params_noise = 0.015
blur_params_brightness = 0.85
blur_params_contrast = 0.92
blur_params_saturation = 1.35

shadows = 0
layer_shadows = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1
unfocused_opacity=1

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide 
layer_animation_type_open=slide
layer_animation_type_close=slide 
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.7
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=240
animation_duration_tag=280
animation_duration_close=240
animation_duration_focus=320
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=5
scroller_default_proportion=0.86
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
smart_gaps=0
default_master_factor=0.50
default_master_count=1

#Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=0
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,dwindle,fair,scroller,monocle,grid,deck,center_tile
enable_floating_snap=1
snap_distance=50
cursor_size=32
cursor_theme=Bibata-Modern-Amber
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=28
repeat_delay=500
numlock_on=1
xkb_rules_layout=us
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# Trackpad 
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.2
# scroll_button=274
# scroll_method=1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x2a1d31ff
focus_color=0xc79effff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0xBABD2Cff
urgent_color=0xad401fff
scratchpad_color=0xc4939dff
global_color=0x8d64cfff
overlay_color=0x95C381ff

source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# run autostart
exec_once=~/.config/mango/autostart.sh
